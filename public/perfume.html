<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Aisthara — Perfume</title>
  <meta name="description" content="Descubre notas, acordes y características de este perfume en Aisthara">

  <style>
    :root{
      --bg:#f7f3ee;
      --paper:#ffffff;
      --ink:#201b18;
      --muted:#756c66;
      --line:#e2d9d2;
      --accent:#8b6251;
      --accent-dark:#614337;
      --soft:#eee4dc;
      --soft2:#f4ede8;
      --shadow:0 16px 45px rgba(53,39,31,.07);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
    }

    /* HEADER */

    header{
      height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 5vw;
      background:rgba(255,255,255,.95);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(12px);
    }

    .brand{
      font:22px Georgia,serif;
      letter-spacing:.32em;
      cursor:pointer;
      user-select:none;
    }

    .headerRight{
      display:flex;
      align-items:center;
      gap:28px;
    }

    .finderLink{
      text-decoration:none;
      color:var(--muted);
      font-size:13px;
      transition:.2s;
    }

    .finderLink:hover{
      color:var(--ink);
    }

    .lang{
      display:flex;
      align-items:center;
      background:var(--soft2);
      border-radius:999px;
      padding:3px;
    }

    .lang button{
      border:0;
      background:none;
      cursor:pointer;
      padding:7px 10px;
      border-radius:999px;
      color:#8b837c;
      font-size:12px;
    }

    .lang .active{
      color:#fff;
      background:var(--accent);
      font-weight:700;
    }

    /* MAIN */

    main{
      width:min(1380px,92vw);
      margin:0 auto;
      padding:34px 0 90px;
    }

    .breadcrumb{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:13px;
      color:var(--muted);
      margin-bottom:28px;
    }

    .breadcrumb a{
      color:inherit;
      text-decoration:none;
    }

    .breadcrumb a:hover{
      color:var(--ink);
    }

    /* HERO */

    .hero{
      display:grid;
      grid-template-columns:minmax(420px, .9fr) minmax(0, 1.1fr);
      gap:70px;
      align-items:start;
    }

    .imageSide{
      position:sticky;
      top:110px;
    }

    .imageBox{
      position:relative;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:28px;
      min-height:620px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .imageBox::after{
      content:"";
      position:absolute;
      inset:auto 12% 8% 12%;
      height:60px;
      background:rgba(73,52,42,.09);
      filter:blur(28px);
      border-radius:50%;
      z-index:0;
    }

    .imageBox img{
      width:82%;
      height:540px;
      object-fit:contain;
      padding:25px;
      position:relative;
      z-index:2;
      transition:transform .35s ease;
    }

    .imageBox:hover img{
      transform:scale(1.035);
    }

    .placeholder{
      font:24px Georgia,serif;
      letter-spacing:.18em;
      color:#aaa;
    }

    .imageCaption{
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    /* INFO */

    .contentSide{
      padding-top:18px;
    }

    .brandName{
      color:var(--accent);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-weight:700;
      margin-bottom:14px;
    }

    h1{
      font:400 clamp(44px,5vw,76px)/.98 Georgia,serif;
      margin:0;
      max-width:850px;
      letter-spacing:-.035em;
    }

    .quickMeta{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin:24px 0 0;
    }

    .quickMeta span{
      border:1px solid var(--line);
      background:rgba(255,255,255,.6);
      padding:8px 12px;
      border-radius:999px;
      color:var(--muted);
      font-size:12px;
    }

    .descriptionWrap{
      margin-top:34px;
      padding:28px 30px;
      background:rgba(255,255,255,.55);
      border-left:3px solid var(--accent);
      border-radius:0 18px 18px 0;
    }

    .description{
      color:#5f5751;
      line-height:1.85;
      font-size:16px;
      max-width:850px;
    }

    .section{
      margin-top:42px;
      padding-top:32px;
      border-top:1px solid var(--line);
    }

    .sectionHeader{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:20px;
      margin-bottom:18px;
    }

    .section h2{
      font:400 32px Georgia,serif;
      margin:0;
    }

    .sectionSubtitle{
      color:var(--muted);
      font-size:13px;
    }

    /* ACCORDS */

    .accordGrid{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .accord{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:999px;
      padding:10px 15px;
      font-size:13px;
      box-shadow:0 4px 12px rgba(0,0,0,.025);
    }

    /* NOTES */

    .notesGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .noteColumn{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:20px;
      padding:22px;
      min-height:150px;
    }

    .noteColumn h3{
      margin:0 0 14px;
      font:400 20px Georgia,serif;
    }

    .noteType{
      display:block;
      color:var(--accent);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-family:Arial,Helvetica,sans-serif;
      margin-bottom:5px;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .chip{
      background:var(--soft2);
      color:#5c514a;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
    }

    /* CHARACTERISTICS */

    .characterGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .info{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px 20px;
      min-height:82px;
    }

    .info small{
      display:block;
      color:var(--muted);
      margin-bottom:8px;
      text-transform:uppercase;
      font-size:10px;
      letter-spacing:.11em;
    }

    .infoValue{
      font-size:15px;
      line-height:1.4;
    }

    /* COMPARATOR */

    .compare{
      margin-top:55px;
      background:linear-gradient(135deg,#28201c,#4b392f);
      color:#fff;
      border-radius:28px;
      padding:38px 42px;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:30px;
      box-shadow:0 18px 50px rgba(38,27,21,.15);
    }

    .compareEyebrow{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.16em;
      opacity:.65;
      margin-bottom:9px;
    }

    .compare h2{
      font:400 36px Georgia,serif;
      margin:0 0 10px;
    }

    .compare p{
      margin:0;
      color:rgba(255,255,255,.72);
      line-height:1.6;
      max-width:650px;
      font-size:14px;
    }

    .compareButton{
      border:1px solid rgba(255,255,255,.28);
      background:#fff;
      color:#2a211c;
      padding:14px 20px;
      border-radius:999px;
      white-space:nowrap;
      font-size:13px;
      font-weight:700;
      opacity:.5;
      cursor:not-allowed;
    }

    /* BOTTOM */

    .bottomActions{
      display:flex;
      justify-content:center;
      margin-top:55px;
    }

    .backButton{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:13px 20px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--paper);
      text-decoration:none;
      color:var(--ink);
      font-size:13px;
      transition:.2s;
    }

    .backButton:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(0,0,0,.06);
    }

    /* LOADING */

    .loading,.error{
      min-height:60vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:80px 20px;
      color:var(--muted);
    }

    /* RESPONSIVE */

    @media(max-width:1050px){

      .hero{
        grid-template-columns:380px 1fr;
        gap:40px;
      }

      .imageBox{
        min-height:500px;
      }

      .imageBox img{
        height:430px;
      }

      .notesGrid{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:820px){

      header{
        padding:0 20px;
      }

      .finderLink{
        display:none;
      }

      main{
        width:min(92vw,700px);
        padding-top:24px;
      }

      .hero{
        grid-template-columns:1fr;
        gap:30px;
      }

      .imageSide{
        position:static;
      }

      .imageBox{
        min-height:420px;
      }

      .imageBox img{
        height:380px;
      }

      .contentSide{
        padding-top:0;
      }

      h1{
        font-size:48px;
      }

      .characterGrid{
        grid-template-columns:repeat(2,1fr);
      }

      .compare{
        grid-template-columns:1fr;
        padding:30px;
      }

      .compareButton{
        width:max-content;
      }
    }

    @media(max-width:520px){

      header{
        height:66px;
      }

      .brand{
        font-size:17px;
        letter-spacing:.24em;
      }

      main{
        width:91vw;
      }

      .breadcrumb{
        margin-bottom:20px;
      }

      .imageBox{
        min-height:350px;
        border-radius:20px;
      }

      .imageBox img{
        height:320px;
      }

      h1{
        font-size:40px;
      }

      .descriptionWrap{
        padding:20px;
      }

      .description{
        font-size:15px;
      }

      .characterGrid{
        grid-template-columns:1fr;
      }

      .compare{
        border-radius:22px;
        padding:26px 22px;
      }

      .compare h2{
        font-size:30px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand" onclick="location.href='/'">
    AISTHARA
  </div>

  <div class="headerRight">

    <a href="/" class="finderLink">
      Encuentra tu perfume
    </a>

    <div class="lang">
      <button id="esBtn" class="active">ES</button>
      <button id="enBtn">EN</button>
    </div>

  </div>

</header>

<main id="app">

  <div class="loading">
    Cargando perfume...
  </div>

</main>

<script>

let lang = "es";
let perfume = null;

const t = (es,en) => lang === "es" ? es : en;

function escapeHtml(value){
  return (value || "")
    .toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function splitTags(value){
  return (value || "")
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);
}

function chips(items){
  return items
    .map(item => `<span class="chip">${escapeHtml(item)}</span>`)
    .join("");
}

function infoCard(label,value){

  if(!value){
    return "";
  }

  return `
    <div class="info">
      <small>${label}</small>
      <div class="infoValue">
        ${escapeHtml(value)}
      </div>
    </div>
  `;
}

function render(){

  const app = document.getElementById("app");

  if(!perfume){

    app.innerHTML = `
      <div class="error">
        ${t("Perfume no encontrado.","Fragrance not found.")}
      </div>
    `;

    return;
  }

  const description =
    lang === "es"
      ? (perfume.description_es || perfume.description_en || "")
      : (perfume.description_en || perfume.description_es || "");

  const image = perfume.image_url
    ? `
      <img
        src="${escapeHtml(perfume.image_url)}"
        alt="${escapeHtml(perfume.name)}"
        referrerpolicy="no-referrer"
        loading="lazy">
    `
    : `<div class="placeholder">AISTHARA</div>`;

  const topNotes = splitTags(perfume.notes_top);
  const heartNotes = splitTags(perfume.notes_heart);
  const baseNotes = splitTags(perfume.notes_base);
  const accords = splitTags(perfume.accords);

  const hasNotes =
    topNotes.length ||
    heartNotes.length ||
    baseNotes.length;

  const quickMeta = [
    perfume.gender,
    perfume.season,
    perfume.occasion
  ].filter(Boolean);

  app.innerHTML = `

    <div class="breadcrumb">

      <a href="/">
        ${t("Inicio","Home")}
      </a>

      <span>›</span>

      <span>
        ${escapeHtml(perfume.brand || "")}
      </span>

      <span>›</span>

      <strong>
        ${escapeHtml(perfume.name)}
      </strong>

    </div>


    <section class="hero">


      <div class="imageSide">

        <div class="imageBox">
          ${image}
        </div>

        <div class="imageCaption">
          ${escapeHtml(perfume.brand || "")}
        </div>

      </div>


      <div class="contentSide">

        <div class="brandName">
          ${escapeHtml(perfume.brand)}
        </div>

        <h1>
          ${escapeHtml(perfume.name)}
        </h1>


        ${
          quickMeta.length
          ? `
            <div class="quickMeta">
              ${quickMeta
                .map(x => `<span>${escapeHtml(x)}</span>`)
                .join("")}
            </div>
          `
          : ""
        }


        ${
          description
          ? `
            <div class="descriptionWrap">

              <div class="description">
                ${escapeHtml(description)}
              </div>

            </div>
          `
          : ""
        }


        ${
          accords.length
          ? `
            <section class="section">

              <div class="sectionHeader">

                <h2>
                  ${t("Acordes principales","Main accords")}
                </h2>

                <div class="sectionSubtitle">
                  ${t(
                    "El carácter general de la fragancia",
                    "The overall character of the fragrance"
                  )}
                </div>

              </div>

              <div class="accordGrid">

                ${accords
                  .map(x => `
                    <span class="accord">
                      ${escapeHtml(x)}
                    </span>
                  `)
                  .join("")}

              </div>

            </section>
          `
          : ""
        }


        ${
          hasNotes
          ? `
            <section class="section">

              <div class="sectionHeader">

                <h2>
                  ${t("Pirámide olfativa","Fragrance notes")}
                </h2>

                <div class="sectionSubtitle">
                  ${t(
                    "Cómo evoluciona el perfume",
                    "How the fragrance develops"
                  )}
                </div>

              </div>

              <div class="notesGrid">


                ${
                  topNotes.length
                  ? `
                    <div class="noteColumn">

                      <span class="noteType">
                        ${t("Primera impresión","Opening")}
                      </span>

                      <h3>
                        ${t("Notas de salida","Top notes")}
                      </h3>

                      <div class="chips">
                        ${chips(topNotes)}
                      </div>

                    </div>
                  `
                  : ""
                }


                ${
                  heartNotes.length
                  ? `
                    <div class="noteColumn">

                      <span class="noteType">
                        ${t("El corazón","The heart")}
                      </span>

                      <h3>
                        ${t("Notas de corazón","Heart notes")}
                      </h3>

                      <div class="chips">
                        ${chips(heartNotes)}
                      </div>

                    </div>
                  `
                  : ""
                }


                ${
                  baseNotes.length
                  ? `
                    <div class="noteColumn">

                      <span class="noteType">
                        ${t("La estela","Dry down")}
                      </span>

                      <h3>
                        ${t("Notas de fondo","Base notes")}
                      </h3>

                      <div class="chips">
                        ${chips(baseNotes)}
                      </div>

                    </div>
                  `
                  : ""
                }


              </div>

            </section>
          `
          : ""
        }


        <section class="section">

          <div class="sectionHeader">

            <h2>
              ${t("Características","Characteristics")}
            </h2>

          </div>


          <div class="characterGrid">

            ${infoCard(
              t("Género","Gender"),
              perfume.gender
            )}

            ${infoCard(
              t("Temporada","Season"),
              perfume.season
            )}

            ${infoCard(
              t("Ocasión","Occasion"),
              perfume.occasion
            )}

            ${infoCard(
              t("Duración","Longevity"),
              perfume.longevity
            )}

            ${infoCard(
              t("Proyección","Projection"),
              perfume.projection
            )}

            ${infoCard(
              t("Estilo","Style"),
              perfume.styles
            )}

          </div>

        </section>


        <section class="compare">

          <div>

            <div class="compareEyebrow">
              AISthara price finder
            </div>

            <h2>
              ${t(
                "Encuentra el mejor precio",
                "Find the best price"
              )}
            </h2>

            <p>
              ${t(
                "Estamos preparando el comparador de Aisthara para mostrarte dónde comprar este perfume y comparar las mejores ofertas disponibles.",
                "We're building the Aisthara price comparison tool so you can see where to buy this fragrance and compare the best available offers."
              )}
            </p>

          </div>

          <button class="compareButton" disabled>
            ${t(
              "Comparador próximamente",
              "Coming soon"
            )}
          </button>

        </section>


      </div>

    </section>


    <div class="bottomActions">

      <a href="/" class="backButton">
        ← ${t(
          "Encontrar otro perfume",
          "Find another fragrance"
        )}
      </a>

    </div>

  `;

  document.title =
    `${perfume.name} — ${perfume.brand || "Aisthara"}`;

}


async function loadPerfume(){

  const params =
    new URLSearchParams(location.search);

  const id =
    params.get("id");

  if(!id){

    render();
    return;
  }

  try{

    const response =
      await fetch(`/api/perfumes/${id}`);

    if(!response.ok){
      throw new Error();
    }

    perfume =
      await response.json();

    render();

  }catch(error){

    perfume = null;
    render();

  }

}


function setLang(newLang){

  lang = newLang;

  document.documentElement.lang =
    newLang;

  document.getElementById("esBtn")
    .classList.toggle(
      "active",
      newLang === "es"
    );

  document.getElementById("enBtn")
    .classList.toggle(
      "active",
      newLang === "en"
    );

  render();

}


document
  .getElementById("esBtn")
  .addEventListener(
    "click",
    () => setLang("es")
  );


document
  .getElementById("enBtn")
  .addEventListener(
    "click",
    () => setLang("en")
  );


loadPerfume();

</script>

</body>
</html>
